{% extends 'base.html' %}
{% block title %}Edit Expense{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card form-card bg-white p-4 p-lg-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <p class="eyebrow mb-2">Update Expense Row</p>
                    <h2 class="fw-bold mb-0">Edit Expense</h2>
                </div>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-dark rounded-pill btn-sm px-3">Back</a>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-medium">Amount</label>
                    <input type="number" step="0.01" min="0.01" name="amount" class="form-control form-control-lg" value="{{ expense.amount }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Description</label>
                    <input type="text" name="description" class="form-control form-control-lg" value="{{ expense.description }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Category</label>
                    <input list="categoryOptions" type="text" name="category" class="form-control form-control-lg" value="{{ expense.category }}" required>
                    <datalist id="categoryOptions">
                        {% for category in categories %}
                        <option value="{{ category }}"></option>
                        {% endfor %}
                    </datalist>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Expense Date</label>
                    <input type="date" name="expense_date" class="form-control form-control-lg" value="{{ expense.expense_date.isoformat() }}" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 rounded-pill py-3">Update Expense</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
