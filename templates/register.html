{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card form-card bg-white p-4">
            <h2 class="fw-bold mb-3">Create your account</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Monthly Budget (optional)</label>
                    <input type="number" step="0.01" min="0" name="monthly_budget" class="form-control" placeholder="2000">
                </div>
                <button type="submit" class="btn btn-dark w-100">Create Account</button>
            </form>
            <p class="mt-3 mb-0 text-secondary">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
